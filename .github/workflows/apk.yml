name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

# 这里只负责「能装到手机上的包」：debug 构建 + 单 ABI，产物同步发到 Release 方便下载
permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受 SDK 许可
        run: |
          SDKM=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true
          ls $ANDROID_SDK_ROOT/platforms 2>/dev/null | tail -5

      - uses: gradle/actions/setup-gradle@v4

      - name: 组装 debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 产物大小
        run: ls -l --block-size=K app/build/outputs/apk/debug/ || true

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Melodia coral debug
          body: "commit ${{ github.sha }}"
          files: app/build/outputs/apk/debug/*.apk
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
