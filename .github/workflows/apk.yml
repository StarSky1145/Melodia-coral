name: apk

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只负责「能装到手机/手表上的包」：debug 与 release 各打一份，release 更小，统一发到 Release 方便下载
permissions:
  contents: write

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 接受 SDK 许可
        run: |
          SDKM=$(ls -d $ANDROID_SDK_ROOT/cmdline-tools/*/bin 2>/dev/null | head -1)
          yes | "$SDKM/sdkmanager" --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: 组装 debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 包内体积分布
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ls -l --block-size=M "$APK"
          unzip -l "$APK" | sort -k1 -n | tail -12

      - name: 组装 release（R8）
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: 产物清单
        run: ls -l --block-size=K app/build/outputs/apk/debug/ app/build/outputs/apk/release/ 2>/dev/null || true

      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Melodia coral
          body: "commit ${{ github.sha }}"
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          overwrite_files: true
